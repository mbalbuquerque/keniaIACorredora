<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultado da Avaliação | Kênia AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/resultado.css">

</head>

<body>

<div class="container">

    <div class="card">

        <img src="imagens/kenia2.png" class="avatar">

        <h1>

            Avaliação concluída!

        </h1>

        <p>

            Parabéns!

            Analisei suas informações iniciais.

        </p>

        <div class="resume">

            <div>

                <strong>Nome</strong>

                <span id="nome"></span>

            </div>

            <div>

                <strong>Nível</strong>

                <span id="nivel"></span>

            </div>

            <div>

                <strong>Objetivo</strong>

                <span id="objetivo"></span>

            </div>

            <div>

                <strong>Pace</strong>

                <span id="pace"></span>

            </div>

            <div>

                <strong>Maior distância</strong>

                <span id="distancia"></span>

            </div>

        </div>

        <button id="chatButton">

            Conversar com a Kênia

        </button>

    </div>

</div>

<script src="js/resultado.js"></script>

</body>

</html>
