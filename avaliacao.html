<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avaliação | Kênia AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/avaliacao.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="topo">

            <img src="imagens/kenia1.png" class="avatar">

            <h1>Kênia AI</h1>

            <p>

                Vamos montar seu plano personalizado.

            </p>

        </div>

        <!-- Barra -->

        <div class="progress">

            <div class="progress-bar" id="progressBar"></div>

        </div>

        <div class="steps">

            <span class="active">1</span>

            <span>2</span>

            <span>3</span>

            <span>4</span>

        </div>

        <form id="assessmentForm">

            <!-- ETAPA 1 -->

            <div class="step active">

                <h2>Dados pessoais</h2>

                <div class="grid">

                    <div>

                        <label>Nome</label>

                        <input
                            id="nome"
                            type="text"
                            required>

                    </div>

                    <div>

                        <label>Idade</label>

                        <input
                            id="idade"
                            type="number">

                    </div>

                    <div>

                        <label>Peso (kg)</label>

                        <input
                            id="peso"
                            type="number"
                            step="0.1">

                    </div>

                    <div>

                        <label>Altura (cm)</label>

                        <input
                            id="altura"
                            type="number">

                    </div>

                    <div class="full">

                        <label>Cidade</label>

                        <input
                            id="cidade"
                            type="text">

                    </div>

                </div>

            </div>

            <!-- ETAPA 2 -->

            <div class="step">

                <h2>Corrida</h2>

                <div class="grid">

                    <div>

                        <label>Nível</label>

                        <select id="nivel">

                            <option>Iniciante</option>

                            <option>Intermediário</option>

                            <option>Avançado</option>

                        </select>

                    </div>

                    <div>

                        <label>Objetivo</label>

                        <select id="objetivo">

                            <option>5 km</option>

                            <option>10 km</option>

                            <option>21 km</option>

                            <option>42 km</option>

                            <option>Emagrecer</option>

                            <option>Condicionamento</option>

                        </select>

                    </div>

                    <div>

                        <label>Pace</label>

                        <input
                            id="pace"
                            placeholder="5:30">

                    </div>

                    <div>

                        <label>Maior distância</label>

                        <input
                            id="distancia"
                            placeholder="10 km">

                    </div>

                </div>

            </div>

            <!-- ETAPA 3 -->

            <div class="step">

                <h2>Saúde</h2>

                <div class="grid">

                    <div class="full">

                        <label>Lesões</label>

                        <textarea
                            id="lesoes"
                            rows="4"></textarea>

                    </div>

                    <div class="full">

                        <label> Fale sobre sua alimentação</label>

                        <textarea
                            id="alimentacao"
                            rows="4"></textarea>

                    </div>

                </div>

            </div>

            <!-- ETAPA 4 -->

            <div class="step">

                <h2>Objetivos</h2>

                <div class="grid">

                    <div class="full">

                        <label>

                            Conte um pouco sobre você, seus hábitos, rotina e objetivos. Quanto mais informações você fornecer, melhor será o plano que vou criar para você.

                        </label>

                        <textarea

                            id="observacoes"

                            rows="6">

                        </textarea>

                    </div>

                </div>

            </div>

            <div class="buttons">

                <button

                    type="button"

                    id="prev">

                    Voltar

                </button>

                <button

                    type="button"

                    id="next">

                    Próximo

                </button>

                <button

                    type="submit"

                    id="finish">

                    Finalizar Avaliação

                </button>

            </div>

        </form>

    </div>

</div>

<script src="js/storage.js"></script>

<script src="js/avaliacao.js"></script>

</body>

</html>
